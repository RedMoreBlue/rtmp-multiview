name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python syntax check
        run: python3 -m py_compile multiview.py

      - name: Build image
        run: docker build -t rtmp-multiview:test .

      - name: Smoke test (RTMP in, login, live status, MJPEG out, security)
        run: bash ci/smoke-test.sh rtmp-multiview:test

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push'
        run: |
          IMG=ghcr.io/${GITHUB_REPOSITORY,,}
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAGS="${GITHUB_REF_NAME} latest"
          else
            TAGS="main"
          fi
          for t in $TAGS; do
            docker tag rtmp-multiview:test "$IMG:$t"
            docker push "$IMG:$t"
          done
